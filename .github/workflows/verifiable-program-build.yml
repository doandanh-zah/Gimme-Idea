name: Verifiable program build

on:
  workflow_dispatch:
  push:
    branches: [rebuild-gimme-idea-v2]
    paths:
      - Cargo.lock
      - Cargo.toml
      - Anchor.toml
      - package.json
      - pnpm-lock.yaml
      - packages/solana/**
      - programs/bounty-escrow/**
      - scripts/devnet-bounty-smoke.ts
      - tests/anchor/**
      - .github/workflows/verifiable-program-build.yml

permissions:
  contents: read

jobs:
  source-and-client-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Use pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust source and invariants
        run: |
          cargo fmt --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Check Solana client contract
        run: |
          pnpm --filter @gimme-idea/solana typecheck
          pnpm --filter @gimme-idea/solana test

  bounty-escrow:
    needs: source-and-client-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Use pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install verification tools
        run: |
          cargo install anchor-cli --version 0.31.1 --locked
          cargo install solana-verify --version 0.5.1 --locked
          cargo install query-security-txt --version 1.1.3 --locked

      - name: Build deterministic binary
        run: solana-verify build --library-name bounty_escrow

      - name: Validate security metadata
        run: query-security-txt target/deploy/bounty_escrow.so

      - name: Generate and validate Anchor IDL
        run: anchor idl build --skip-lint -o target/idl/bounty_escrow.json -t target/types/bounty_escrow.ts

      - name: Run Anchor integration tests
        run: |
          node --input-type=module -e 'import {Keypair} from "@solana/web3.js"; import {writeFileSync} from "node:fs"; writeFileSync("/tmp/gimme-test-wallet.json", JSON.stringify([...Keypair.generate().secretKey]))'
          docker run --rm -d --name bounty-validator --network host -v "$PWD:/workspace:ro" -v /tmp/gimme-test-wallet.json:/wallet.json:ro solanafoundation/solana-verifiable-build@sha256:aaba70de1934678695f243763ffa1e7d4cb45fe09a09beb6f634a55b45d0ee85 solana-test-validator --ledger /tmp/test-ledger --reset --quiet --mint /wallet.json --upgradeable-program BB2bMK8gwrDk3YG3GFECqnwnFigDoxvKDwJZiTXtzCK6 /workspace/target/deploy/bounty_escrow.so /wallet.json
          for attempt in {1..30}; do
            if curl --silent http://127.0.0.1:8899 -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep --quiet '"result":"ok"'; then
              break
            fi
            sleep 1
          done
          ANCHOR_PROVIDER_URL=http://127.0.0.1:8899 ANCHOR_WALLET=/tmp/gimme-test-wallet.json pnpm tsx tests/anchor/bounty-escrow.ts

      - name: Stop local validator
        if: always()
        run: docker stop bounty-validator || true

      - name: Record executable hash
        run: |
          HASH=$(solana-verify get-executable-hash target/deploy/bounty_escrow.so)
          echo "### Bounty escrow executable" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hash: \`${HASH}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload program binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounty-escrow-${{ github.sha }}
          path: target/deploy/bounty_escrow.so
          if-no-files-found: error
          retention-days: 14
