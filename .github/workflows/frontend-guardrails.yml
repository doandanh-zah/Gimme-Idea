name: Frontend Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - name: Repo junk guard
        working-directory: .
        run: bash scripts/check-no-junk.sh
      - run: npm run build
      - run: npm run guard:imports
      - run: npm run guard:bundle
      - run: npm run security:markdown
      - run: npm run audit:high
