[package]
name = "bounty-escrow"
version = "0.1.0"
description = "Gimme Idea bounty escrow program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bounty_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
blake3 = "=1.5.4"
solana-security-txt = "=1.1.3"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"
